<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Church tomorrow?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
:root{--a:#ffb3c1;--b:#ffd6e0;--ink:#5a2a3c;--yes:#25b66f;--no:#e0345a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:"Gaegu","Comic Sans MS",cursive;color:var(--ink);background:#ffc4d1;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center;background:linear-gradient(160deg,var(--a),var(--b));transition:background 1s}
body.done{background:linear-gradient(160deg,#ffe3ea,#ffc9d6 55%,#fff1c9)}
.card{width:min(92vw,380px);background:#fffafb;border-radius:28px;padding:28px 22px 26px;text-align:center;box-shadow:0 20px 60px rgba(190,70,110,.28);transition:box-shadow .8s,background .8s}
.done .card{background:transparent;box-shadow:none}
h1{font-size:clamp(30px,8.4vw,38px);line-height:1.05;font-weight:700;min-height:2.1em;display:grid;place-items:center;transition:opacity .35s,transform .35s}
h1.swap{opacity:0;transform:translateY(8px)}
.done h1{color:#e0345a;font-size:clamp(36px,10vw,46px)}
#sub{font-size:22px;opacity:0;max-height:0;transition:opacity 1s .5s;color:#a6566f}
.done #sub{opacity:1;max-height:60px;margin-top:6px}
svg{width:190px;height:auto;margin:6px auto 10px;display:block;overflow:visible;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:wig 3.4s ease-in-out infinite}.ear.r{animation-delay:.4s}
@keyframes wig{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-7deg)}94%{transform:rotate(5deg)}}
.eo{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.eh,.cross,.tear{display:none}
.happy .eo,.happy .heart{display:none}.happy .eh,.happy .cross{display:inline}
.happy{animation:hop .7s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-18px) rotate(-3deg)}}
.sad .tear{display:inline;animation:tear 1.6s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;transition:opacity .4s}
.done .btns{display:none}
button{font:inherit;font-weight:700;border:0;border-radius:999px;color:#fff;cursor:pointer;transition:all .35s cubic-bezier(.3,1.4,.5,1);max-width:100%}
#yes{background:var(--yes);font-size:22px;padding:8px 26px}
#no{background:var(--no);font-size:20px;padding:8px 20px}
#yes.full{position:fixed;inset:0;z-index:5;border-radius:0;font-size:22vmin;max-width:none;padding:0}
.fade{opacity:0!important;pointer-events:none}
.h{position:fixed;top:-40px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<div class="card">
  <h1 id="q">Can we go to church tomorrow?</h1>
  <svg id="b" viewBox="0 0 200 215" aria-label="cute bunny">
    <g class="ear"><ellipse cx="72" cy="52" rx="21" ry="50" transform="rotate(-9 72 52)" fill="#fff" stroke="#f3cdd8" stroke-width="3"/><ellipse cx="73" cy="56" rx="10" ry="34" transform="rotate(-9 73 56)" fill="#ffc2d4"/></g>
    <g class="ear r"><ellipse cx="128" cy="52" rx="21" ry="50" transform="rotate(9 128 52)" fill="#fff" stroke="#f3cdd8" stroke-width="3"/><ellipse cx="127" cy="56" rx="10" ry="34" transform="rotate(9 127 56)" fill="#ffc2d4"/></g>
    <ellipse cx="100" cy="172" rx="50" ry="40" fill="#fff" stroke="#f3cdd8" stroke-width="3"/>
    <ellipse cx="100" cy="114" rx="62" ry="52" fill="#fff" stroke="#f3cdd8" stroke-width="3"/>
    <g class="eo"><ellipse cx="76" cy="114" rx="11" ry="14" fill="#3b1f2b"/><circle cx="80" cy="108" r="4.5" fill="#fff"/><circle cx="72" cy="120" r="2.2" fill="#fff"/>
    <ellipse cx="124" cy="114" rx="11" ry="14" fill="#3b1f2b"/><circle cx="128" cy="108" r="4.5" fill="#fff"/><circle cx="120" cy="120" r="2.2" fill="#fff"/></g>
    <g class="eh" fill="none" stroke="#3b1f2b" stroke-width="5" stroke-linecap="round"><path d="M64 118q12-17 24 0"/><path d="M112 118q12-17 24 0"/></g>
    <path class="tear" d="M66 128q-6 9 0 12q6-3 0-12z" fill="#8fd3ff"/>
    <ellipse cx="55" cy="130" rx="11" ry="6.5" fill="#ff9fb6" opacity=".65"/><ellipse cx="145" cy="130" rx="11" ry="6.5" fill="#ff9fb6" opacity=".65"/>
    <ellipse cx="100" cy="127" rx="5.5" ry="4" fill="#ff7f9f"/>
    <path d="M100 131v4M91 136q4.5 5 9 0q4.5 5 9 0" fill="none" stroke="#8a4b5c" stroke-width="2.4" stroke-linecap="round"/>
    <path class="heart" d="M100 190C82 176 85 160 100 169C115 160 118 176 100 190Z" fill="#ff6b8b"/>
    <g class="cross" fill="#f2b632"><rect x="95.5" y="158" width="9" height="30" rx="2"/><rect x="87" y="166" width="26" height="9" rx="2"/></g>
    <ellipse cx="80" cy="172" rx="13" ry="10" fill="#fff" stroke="#f3cdd8" stroke-width="3"/><ellipse cx="120" cy="172" rx="13" ry="10" fill="#fff" stroke="#f3cdd8" stroke-width="3"/>
  </svg>
  <div class="btns"><button id="yes">Yes</button><button id="no">No</button></div>
  <div id="sub">I'll meet you tom haa💖</div>
</div>
<script>
const msgs=["Are you sure?","Cge na","Pls pls pls","Sure kna ba diyan","Please?? luds","Now lng this","Last na AHAHHAHAHA"];
const yes=document.getElementById('yes'),no=document.getElementById('no'),q=document.getElementById('q'),b=document.getElementById('b');
let n=0;
no.onclick=()=>{
  n++;no.textContent=msgs[Math.min(n,msgs.length)-1];
  const s=22+n*7;yes.style.fontSize=s+'px';yes.style.padding=(s*.4)+'px '+(s*1.1)+'px';
  if(n>=3)b.classList.add('sad');
  if(n>msgs.length)yes.classList.add('full');
};
yes.onclick=()=>{
  yes.classList.add('fade');
  setTimeout(()=>{yes.classList.remove('full')},400);
  q.classList.add('swap');
  setTimeout(()=>{q.textContent='Yay!! See you at church tomorrow  betch⛪';q.classList.remove('swap')},350);
  document.body.classList.add('done');b.classList.remove('sad');b.classList.add('happy');
  const cols=['#ff6b8b','#ff9fb6','#f2b632','#ffd6e0','#e0345a'],sy=['♥','♥','✦','♥','✝'];
  setInterval(()=>{const h=document.createElement('span');h.className='h';
    h.textContent=sy[Math.floor(Math.random()*sy.length)];
    h.style.left=Math.random()*100+'vw';h.style.fontSize=(14+Math.random()*22)+'px';
    h.style.color=cols[Math.floor(Math.random()*cols.length)];
    h.style.animationDuration=(3+Math.random()*3)+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),6500)},170);
};
</script>
</body></html>
